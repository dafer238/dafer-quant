[package]
name = "algJSL"
version = "0.1.0"
edition = "2024"

[dependencies]

# Local crates
perf_macro = {path="../perf_macro"} # Macro to measure performance
utils = {path="../utils"}           # Utils common to the project

# Shared from the workspace
chrono.workspace = true             
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true

# Backend calculations specific
polars = { version = "0.46.0", default-features = false, features = ["lazy", "csv", "describe", "fmt", "serde"] }
argon2 = {version="0.5.3", features=["rand"]}
rand = "0.9.0"
base64 = "0.22.1"
