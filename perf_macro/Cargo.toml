# ./perf_macro/Cargo.toml

[package]
name = "perf_macro"
version = "0.1.0"
authors = ["dafer <dafernandezperez@gmail.com>"]
edition = "2024"

[lib]
proc-macro = true

[dependencies]

# Local crates
utils = {path="../utils"}           # Utils common to the project

chrono.workspace = true

syn = { version = "2", features = ["full"] }
quote = "1"  # You probably have this too
proc-macro2 = "1"
