# ./pmm-perf/Cargo.toml

[package]
name = "pmm-perf"
version = "0.1.0"
authors = ["Daniel Perez <daniel.perez@pmmgt.com>"]
edition = "2024"

[lib]
proc-macro = true

[dependencies]

# Local crates
pmm-utils = {path="../pmm-utils"}           # pmm-utils common to the project

chrono.workspace = true

syn = { version = "2.0.114", features = ["full"] }
quote = "1.0.44"  # You probably have this too
proc-macro2 = "1.0.106"
